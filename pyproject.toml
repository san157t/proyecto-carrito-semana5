[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E: estilo, F: errores, B: errores probables (bugbear), S: seguridad (bandit), W: espacios
select = ["E", "F", "B", "S", "W"]

[tool.ruff.lint.per-file-ignores]
# assert es la forma normal de comprobar en pytest
"test_*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
